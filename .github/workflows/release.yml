name: Release

# A tag such as v3.1.1 (pushed, or made with a release) builds, tests and publishes the .streamDeckPlugin file,
# with the notes from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: The tag matches the manifest version
        run: |
          node -e '
            const version = require("./agency.rivo.usage-meter-for-claude.sdPlugin/manifest.json").Version;
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (!version.startsWith(`${tag}.`)) { console.error(`manifest ${version}, tag ${tag}`); process.exit(1); }
          '
      - run: npm test
      - run: npm run pack
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" 'index($0, "## " v " ") == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=dist/agency.rivo.usage-meter-for-claude.streamDeckPlugin
          # a release made by hand for this tag gets the file built here
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$file" --title "Usage Meter for Claude ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
